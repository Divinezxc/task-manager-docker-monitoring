<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СПО: Панель управления задачами</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button.btn-add {
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button.btn-add:hover {
      background: var(--accent-hover);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .filters {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      color: var(--accent-color);
      background: rgba(99, 102, 241, 0.1);
      font-weight: 600;
    }

    ul.task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-color);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      transition: transform 0.1s ease;
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .task-text {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1.1rem;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--danger-color);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span style="font-size: 1.6rem;">📋</span>
      <h1>Панель задач СПО</h1>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Введите новую задачу..." onkeydown="if(event.key==='Enter') addTask()">
      <button class="btn-add" onclick="addTask()">Добавить</button>
    </div>

    <div class="stats-bar">
      <span id="taskCounter">Всего задач: 0</span>
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Активные</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Готовые</button>
      </div>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('spo_tasks')) || [];
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('spo_tasks', JSON.stringify(tasks));
      render();
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, completed: false });
      input.value = '';
      saveTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      let filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      document.getElementById('taskCounter').innerText = `Всего задач: ${tasks.length}`;

      if (filteredTasks.length === 0) {
        list.innerHTML = '<div class="empty-state">Список задач пуст</div>';
        return;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-content">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span class="task-text">${escapeHtml(task.text)}</span>
          </div>
          <button class="btn-delete" onclick="deleteTask(${task.id})">&times;</button>
        `;
        list.appendChild(li);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    render();
  </script>

</body>
</html>
