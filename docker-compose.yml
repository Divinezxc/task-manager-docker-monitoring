version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spo_html_app
    ports:
      - "80:80"
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: spo_nginx_exporter
    command:
      - -nginx.scrape-uri=http://app:80/metrics_status
    ports:
      - "9113:9113"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: spo_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: spo_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus